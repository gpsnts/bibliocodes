<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var l = window.location;
      var base = ''; // domínio raiz, sem subpath
      var rest = l.pathname || '/';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(rest + (l.search || '') + (l.hash || ''))
      );
    </script>
  </head>
  <body></body>
</html>
